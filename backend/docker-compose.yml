services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: fun_project_db
    ports:
      - "5432:5432"
    volumes:
      # This saves your database data locally so it persists between restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d fun_project_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Pass the connection string to your API
      DATABASE_URL: postgresql+asyncpg://myuser:mypassword@db:5432/fun_project_db
volumes:
  postgres_data: